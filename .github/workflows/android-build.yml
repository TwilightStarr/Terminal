name: Android APK Derle

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot Android Export
        uses: dulvui/godot-android-export@v4.0.0
        with:
          working-directory: .
          godot-version: 4.3

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: terminal-apk
          path: build/*.apk
