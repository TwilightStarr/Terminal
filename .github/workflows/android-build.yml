name: Android APK Derle

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export Android
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.7/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.7/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_export_output: true
          export_debug: false
          android_keystore_file_base64: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}
          android_keystore_user: ${{ secrets.ANDROID_KEYSTORE_USER }}
          android_keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: terminal-apk
          path: build/*.apk
